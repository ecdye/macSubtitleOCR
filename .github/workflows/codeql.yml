name: CodeQL

on:
  push:
    branches: [main]
    paths: ['**/*.swift']
  workflow_dispatch: # Allows manual trigger

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: macos-latest
    permissions:
      security-events: write
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install FFmpeg
      run: brew install ffmpeg

    - name: Select Xcode
      uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
      with:
        swift: '6'
        action: none

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: swift
        build-mode: manual

    - name: Build
      env:
        USE_FFMPEG: 1
      run: xcrun swift build --arch arm64

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        category: "macSubtitleOCR"
