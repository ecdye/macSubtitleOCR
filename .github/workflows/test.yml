name: Test

on:
  push:
    branches:
      - main
    paths:
      - '**/*.swift'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.swift'

jobs:
  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies
        run: |
          brew install ffmpeg --quiet

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '^26'

      - name: Build Tests
        run: USE_FFMPEG=1 xcrun swift build --build-tests -Xswiftc -DGITHUB_ACTIONS

      - name: Test FFmpeg Decoder
        timeout-minutes: 5
        run: xcrun swift test --skip-build --filter ffmpegDecoder

      - name: Test Internal Decoder
        timeout-minutes: 5
        run: xcrun swift test --skip-build --filter internalDecoder

      # recognizesAntiAliasedFrames and frameTooSmallToRecognizeIsEnlarged hold Vision to exact readings
      # that the virtualized macOS 26 runner does not reproduce, so they are left to run locally.
      - name: Test Everything Else
        timeout-minutes: 5
        run: >-
          xcrun swift test --skip-build
          --skip ffmpegDecoder --skip internalDecoder
          --skip recognizesAntiAliasedFrames --skip frameTooSmallToRecognizeIsEnlarged
