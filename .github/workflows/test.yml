name: Test

on:
  push:
    branches:
      - main
    paths:
      - '**/*.swift'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.swift'

jobs:
  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Dependencies
        run: |
          brew install ffmpeg periphery --quiet

      - name: Select Xcode
        uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
        with:
          swift: '6'
          action: none

      - name: Build Tests
        run: USE_FFMPEG=1 xcrun swift build --build-tests -Xswiftc -DGITHUB_ACTIONS

      - name: Test FFmpeg Decoder
        timeout-minutes: 5
        run: xcrun swift test --skip-build --filter ffmpegDecoder

      - name: Test Internal Decoder
        timeout-minutes: 5
        run: xcrun swift test --skip-build --filter internalDecoder

      - name: Periphery
        run: periphery scan --skip-build --format github-actions --relative-results --strict
